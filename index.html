<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฟอร์มขอซื้ออุปกรณ์สำนักงาน - Want Want Thailand</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #c8102e; --primary-hover: #9b0b21; --bg-color: #f8f9fa; --text: #212529; --border: #dee2e6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); padding: 20px; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--primary); padding-bottom: 15px; }
        .logo { max-width: 140px; height: auto; margin-bottom: 8px; }
        .header h1 { color: var(--primary); font-size: 24px; margin-top: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; }
        .item-card { background: #fdfdfd; border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; margin-bottom: 12px; position: relative; }
        .item-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 8px; }
        .item-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; width: 100%; font-size: 16px; margin-top: 15px; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-add { background: #e9ecef; color: var(--text); width: 100%; }
        .btn-remove { background: #dc3545; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; position: absolute; top: 10px; right: 10px; }
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logo.png" alt="Want Want Logo" class="logo">
        <h1>แบบฟอร์มขอซื้ออุปกรณ์สำนักงาน</h1>
        <p style="color: #6c757d;">บริษัท วอนท์ วอนท์ (ประเทศไทย) จำกัด</p>
    </div>

    <div id="alertMsg" class="alert alert-success">บันทึกรายการขอซื้ออุปกรณ์สำนักงานเรียบร้อยแล้ว!</div>

    <form id="requisitionForm">
        <div class="form-group">
            <label>ชื่อ ผู้ขอซื้อ (Requester Name) *</label>
            <input type="text" id="empName" required placeholder="เช่น สมชาย">
        </div>
        <div class="form-group">
            <label>แผนก (Department) *</label>
            <select id="department" required>
                <option value="">-- กรุณาเลือกแผนก --</option>
                <option value="Product and Marketing Management">Product and Marketing Management</option>
                <option value="Finance">Finance</option>
                <option value="Logistics">Logistics</option>
                <option value="Sales">Sales</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Regulatory Affairs and Quality Assurance">Regulatory Affairs and Quality Assurance</option>
                <option value="IT">IT</option>
            </select>
        </div>

        <div class="form-group">
            <label>รายการอุปกรณ์สำนักงานที่ต้องการขอซื้อ *</label>
            <div id="itemsContainer">
                <div class="item-card">
                    <button type="button" class="btn btn-remove" onclick="removeItem(this)">ลบรายการ</button>
                    <div class="item-grid">
                        <div>
                            <input type="text" class="item-name" placeholder="ชื่ออุปกรณ์ / รายละเอียด" required>
                        </div>
                        <div>
                            <input type="number" class="item-qty" min="1" value="1" placeholder="จำนวน" required>
                        </div>
                        <div>
                            <select class="item-unit" required>
                                <option value="ชิ้น">ชิ้น</option>
                                <option value="ลัง">ลัง</option>
                                <option value="แพ็ค">แพ็ค</option>
                                <option value="กล่อง">กล่อง</option>
                                <option value="เล่ม">เล่ม</option>
                                <option value="โหล">โหล</option>
                                <option value="รีม">รีม</option>
                            </select>
                        </div>
                    </div>
                    <div class="item-links">
                        <input type="url" class="item-ofm" placeholder="ลิงก์สินค้า OFM / เว็บไซต์ (ถ้ามี)">
                        <input type="url" class="item-img" placeholder="ลิงก์รูปภาพประกอบ (URL รูปภาพ) (ถ้ามี)">
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-add" onclick="addItem()">+ เพิ่มรายการอุปกรณ์</button>
        </div>

        <div class="form-group">
            <label>หมายเหตุเพิ่มเติม (Remarks)</label>
            <textarea id="remark" rows="2" placeholder="เช่น ด่วนมาก / ใช้สำหรับจัดงานสัมมนา"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">ส่งรายการขอซื้ออุปกรณ์สำนักงาน</button>
    </form>
</div>

<script>
    // 🛑 นำ Web App URL ที่ได้จาก Google Apps Script มาวางแทนที่บรรทัดนี้
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEKqIMG_GeWwhRza27LgYnwkALPX7xdTBczzcuTzCds4_oeFRxVmmMlyNW1uEp5Os9/exec";

    function addItem() {
        const container = document.getElementById('itemsContainer');
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `
            <button type="button" class="btn btn-remove" onclick="removeItem(this)">ลบรายการ</button>
            <div class="item-grid">
                <div><input type="text" class="item-name" placeholder="ชื่ออุปกรณ์ / รายละเอียด" required></div>
                <div><input type="number" class="item-qty" min="1" value="1" placeholder="จำนวน" required></div>
                <div>
                    <select class="item-unit" required>
                        <option value="ชิ้น">ชิ้น</option>
                        <option value="ลัง">ลัง</option>
                        <option value="แพ็ค">แพ็ค</option>
                        <option value="กล่อง">กล่อง</option>
                        <option value="เล่ม">เล่ม</option>
                        <option value="โหล">โหล</option>
                        <option value="รีม">รีม</option>
                    </select>
                </div>
            </div>
            <div class="item-links">
                <input type="url" class="item-ofm" placeholder="ลิงก์สินค้า OFM / เว็บไซต์ (ถ้ามี)">
                <input type="url" class="item-img" placeholder="ลิงก์รูปภาพประกอบ (URL รูปภาพ) (ถ้ามี)">
            </div>
        `;
        container.appendChild(div);
    }

    function removeItem(btn) {
        const cards = document.querySelectorAll('.item-card');
        if(cards.length > 1) {
            btn.parentElement.remove();
        } else {
            alert('ต้องมีอย่างน้อย 1 รายการครับ');
        }
    }

    document.getElementById('requisitionForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "กำลังบันทึกข้อมูล...";

        const items = [];
        document.querySelectorAll('.item-card').forEach(card => {
            items.push({
                name: card.querySelector('.item-name').value,
                qty: card.querySelector('.item-qty').value,
                unit: card.querySelector('.item-unit').value,
                ofmLink: card.querySelector('.item-ofm').value,
                imageUrl: card.querySelector('.item-img').value
            });
        });

        const payload = {
            empName: document.getElementById('empName').value,
            department: document.getElementById('department').value,
            items: items,
            remark: document.getElementById('remark').value
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            document.getElementById('alertMsg').style.display = 'block';
            document.getElementById('requisitionForm').reset();
            submitBtn.disabled = false;
            submitBtn.innerText = "ส่งรายการขอซื้ออุปกรณ์สำนักงาน";
            setTimeout(() => { document.getElementById('alertMsg').style.display = 'none'; }, 4000);
        }).catch(err => {
            alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
            submitBtn.disabled = false;
            submitBtn.innerText = "ส่งรายการขอซื้ออุปกรณ์สำนักงาน";
        });
    });
</script>
</body>
</html>
