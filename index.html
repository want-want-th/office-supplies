<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเบิกอุปกรณ์สำนักงาน - Want Want Thailand</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c8102e;
            --primary-hover: #9b0b21;
            --bg-color: #f8f9fa;
            --text: #212529;
            --border: #dee2e6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); padding: 20px; min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--primary); padding-bottom: 15px; }
        .header h1 { color: var(--primary); font-size: 24px; margin-top: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; }
        .item-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; width: 100%; font-size: 16px; margin-top: 15px; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-add { background: #e9ecef; color: var(--text); }
        .btn-remove { background: #dc3545; color: #fff; padding: 5px 12px; border-radius: 4px; }
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 15px; display: none; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📦 ฟอร์มเบิกอุปกรณ์สำนักงาน</h1>
        <p style="color: #6c757d;">บริษัท วอนท์ วอนท์ (ประเทศไทย) จำกัด</p>
    </div>

    <div id="alertMsg" class="alert alert-success">ส่งรายการสั่งซื้อเรียบร้อยแล้ว!</div>

    <form id="requisitionForm">
        <div class="form-group">
            <label>รหัสพนักงาน / Employee ID *</label>
            <input type="text" id="empId" required placeholder="เช่น WW1024">
        </div>
        <div class="form-group">
            <label>ชื่อ-นามสกุล / Full Name *</label>
            <input type="text" id="empName" required placeholder="เช่น สมชาย ใจดี">
        </div>
        <div class="form-group">
            <label>แผนก / Department *</label>
            <select id="department" required>
                <option value="">-- กรุณาเลือกแผนก --</option>
                <option value="Accounting & Finance">Accounting & Finance</option>
                <option value="Audit & Internal Control">Audit & Internal Control</option>
                <option value="Sales & Marketing">Sales & Marketing</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Supply Chain & Logistics">Supply Chain & Logistics</option>
            </select>
        </div>

        <div class="form-group">
            <label>รายการที่ต้องการเบิก *</label>
            <div id="itemsContainer">
                <div class="item-row">
                    <input type="text" class="item-name" placeholder="ชื่ออุปกรณ์ (เช่น ปากกาลูกลื่นสีส้ม)" required>
                    <input type="number" class="item-qty" min="1" value="1" style="width: 100px;" required>
                    <button type="button" class="btn btn-remove" onclick="removeItem(this)">✕</button>
                </div>
            </div>
            <button type="button" class="btn btn-add" onclick="addItem()">+ เพิ่มรายการ</button>
        </div>

        <div class="form-group">
            <label>หมายเหตุเพิ่มเติม</label>
            <textarea id="remark" rows="2" placeholder="เช่น ด่วนมาก / ใช้สำหรับจัดสัมมนา"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">ส่งรายการเบิกอุปกรณ์</button>
    </form>
</div>

<script>
    // 🛑 นำ Web App URL ที่ได้จาก Google Apps Script มาวางแทนที่บรรทัดนี้
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnLCMGVTpOim7CzeAM2N_4ltImj73MbQKOrV6R4GJw3Qd-HZE72qkCD8Py5Gh_isKY/exec";

    function addItem() {
        const container = document.getElementById('itemsContainer');
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `
            <input type="text" class="item-name" placeholder="ชื่ออุปกรณ์" required>
            <input type="number" class="item-qty" min="1" value="1" style="width: 100px;" required>
            <button type="button" class="btn btn-remove" onclick="removeItem(this)">✕</button>
        `;
        container.appendChild(div);
    }

    function removeItem(btn) {
        const rows = document.querySelectorAll('.item-row');
        if(rows.length > 1) {
            btn.parentElement.remove();
        } else {
            alert('ต้องมีอย่างน้อย 1 รายการครับ');
        }
    }

    document.getElementById('requisitionForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "กำลังส่งข้อมูล...";

        const items = [];
        document.querySelectorAll('.item-row').forEach(row => {
            items.push({
                name: row.querySelector('.item-name').value,
                qty: row.querySelector('.item-qty').value
            });
        });

        const payload = {
            empId: document.getElementById('empId').value,
            empName: document.getElementById('empName').value,
            department: document.getElementById('department').value,
            items: items,
            remark: document.getElementById('remark').value
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            document.getElementById('alertMsg').style.display = 'block';
            document.getElementById('requisitionForm').reset();
            submitBtn.disabled = false;
            submitBtn.innerText = "ส่งรายการเบิกอุปกรณ์";
            setTimeout(() => { document.getElementById('alertMsg').style.display = 'none'; }, 4000);
        }).catch(err => {
            alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
            submitBtn.disabled = false;
            submitBtn.innerText = "ส่งรายการเบิกอุปกรณ์";
        });
    });
</script>
</body>
</html>
